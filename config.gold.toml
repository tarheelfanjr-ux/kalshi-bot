# Paper test of the frozen gold token rule (kbot/gold.py). Use with:
#   python -m kbot --config config.gold.toml run
# Real-money orders are impossible here: gold_token refuses any mode but paper.
mode = "paper"
data_env = "production"     # live production market data, read without a key
db_path = "data/paper-gold.sqlite"
series = ["KXGOLD15M"]
max_data_age_s = 10.0
max_clock_skew_s = 2.0
loop_interval_s = 2.0
notify_webhook = ""

[risk]
bankroll = 25.0             # the real limits. Every signal is still logged at 1 contract for research.
max_position_risk_pct = 0.01
max_open_risk_pct = 0.05
max_daily_loss_pct = 0.02
max_consecutive_losses = 5
max_open_positions = 3
max_market_inventory = 1

[strategy]
name = "gold_token"         # the rule's own thresholds are frozen in kbot/gold.py, not here
min_net_edge = 0.0
min_seconds_left = 45
max_seconds_left = 600
max_spread = 0.05
