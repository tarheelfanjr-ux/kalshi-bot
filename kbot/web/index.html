<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>kbot control center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 22 22%27%3E%3Ccircle cx=%2711%27 cy=%2711%27 r=%279.5%27 fill=%27none%27 stroke=%27%23f4f4f5%27 stroke-width=%271.5%27/%3E%3Cpath d=%27M11 11V1.5A9.5 9.5 0 0 1 20.5 11Z%27 fill=%27%232fd88a%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="menu" aria-label="Open navigation" aria-expanded="false"><svg viewBox="0 0 18 18"><path d="M2 5h14M2 9h14M2 13h14"/></svg></button>
    <b id="topbar-title">Overview</b>
    <span id="topbar-state" class="pill"></span>
  </header>
  <nav class="sidebar" id="sidebar" aria-label="Main">
    <div class="brand">
      <!-- the mark: a quarter of a clock face, one 15-minute window -->
      <svg viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9.5" fill="none" stroke="#f4f4f5" stroke-width="1.5"/><path d="M11 11V1.5A9.5 9.5 0 0 1 20.5 11Z" fill="#2fd88a"/></svg>
      <b>kbot</b>
    </div>
    <div class="scope" id="scope">Kalshi 15-minute bot</div>
    <a class="nav-item" href="#/overview"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span>Overview</span></a>
    <a class="nav-item" href="#/markets"><svg viewBox="0 0 16 16"><path d="M1.5 9h3l2-5 3 8 2-4h3"/></svg><span>Live markets</span></a>
    <a class="nav-item" href="#/trades"><svg viewBox="0 0 16 16"><path d="M5 4h9M5 8h9M5 12h9M2 4h.5M2 8h.5M2 12h.5"/></svg><span>Positions and trades</span></a>
    <a class="nav-item" href="#/strategies"><svg viewBox="0 0 16 16"><path d="M2 13.5h12M4 11V7M8 11V3.5M12 11V8.5"/></svg><span>Strategies</span></a>
    <a class="nav-item" href="#/backtest"><svg viewBox="0 0 16 16"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9M2.5 2.5v2.6h2.6M8 5v3l2 1.5"/></svg><span>Backtesting</span></a>
    <a class="nav-item" href="#/controls"><svg viewBox="0 0 16 16"><path d="M8 1.5v6M4.4 3.8a5.5 5.5 0 1 0 7.2 0"/></svg><span>Bot controls</span></a>
    <a class="nav-item" href="#/settings"><svg viewBox="0 0 16 16"><path d="M2 4h7M12 4h2M2 12h2M7 12h7M10.5 2.5v3M5.5 10.5v3"/></svg><span>Settings</span></a>
    <div class="bottom">
      <div class="row2"><span>Bot</span><span id="side-state" class="pill">Connecting</span></div>
      <div class="row2"><span>Real money</span><span class="pill" id="side-prod">Off</span></div>
      <button class="card-link" id="logout" hidden>Log out</button>
    </div>
  </nav>
  <main class="canvas" id="view" tabindex="-1"></main>
</div>

<dialog id="confirm">
  <form method="dialog" class="body" id="confirm-form">
    <h2 id="confirm-title"></h2>
    <div id="confirm-text" class="muted"></div>
    <div class="field" id="confirm-field" hidden><label for="confirm-input" id="confirm-label"></label><textarea class="input" id="confirm-input" maxlength="300"></textarea></div>
    <div class="btn-row"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn" id="confirm-ok" value="ok"></button></div>
  </form>
</dialog>
<dialog id="detail" class="sheet"><div class="body" id="detail-body"></div></dialog>

<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
